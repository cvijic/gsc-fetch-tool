<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>GSC Fetch</title></head>
<body>
<pre id="out">Loading...</pre>
<script>
// Params can be anywhere in the URL (works through htmlpreview nesting)
(async () => {
  const out = document.getElementById('out');
  try {
    const raw = decodeURIComponent(location.href);
    const get = (k) => {
      const m = raw.match(new RegExp('[?&]' + k + '=([^&#]*)'));
      return m ? m[1] : null;
    };
    const token = get('token');
    const site = get('site');
    const dims = (get('dims') || 'query').split(',');
    const body = {
      startDate: get('start'),
      endDate: get('end'),
      dimensions: dims,
      rowLimit: parseInt(get('limit') || '25000', 10),
      startRow: parseInt(get('row') || '0', 10),
      dataState: 'all'
    };
    const country = get('country');
    if (country) {
      body.dimensionFilterGroups = [{ filters: [{ dimension: 'country', operator: 'equals', expression: country }] }];
    }
    out.textContent = 'Fetching ' + site + ' ' + get('start') + '..' + get('end') + ' ...';
    const url = 'https://www.googleapis.com/webmasters/v3/sites/' + encodeURIComponent(site)
      + '/searchAnalytics/query?access_token=' + encodeURIComponent(token);
    const resp = await fetch(url, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    });
    const text = await resp.text();
    out.textContent = 'HTTP ' + resp.status + '\n' + text;
    document.title = 'DONE ' + resp.status;
  } catch (e) {
    out.textContent = 'JS ERROR: ' + e.message;
    document.title = 'ERROR';
  }
})();
</script>
</body>
</html>
